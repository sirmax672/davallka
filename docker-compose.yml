services:
  davallka:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    volumes:
      - ./uploads:/app/uploads:ro
      - ./state:/app/state
    env_file: .env
    environment:
      PORT: "80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
