<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize MCP access · d'Avallka</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #17212b; background: #f3f6fa; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
        main { width: min(100%, 560px); background: white; border-radius: 18px; padding: 32px; box-shadow: 0 12px 40px #142b4618; box-sizing: border-box; }
        h1 { margin: 0 0 10px; font-size: 25px; }
        p { line-height: 1.55; color: #435262; }
        .client { font-weight: 650; color: #164b70; overflow-wrap: anywhere; }
        .details { background: #f5f8fb; border-radius: 12px; padding: 18px; margin: 22px 0; }
        .details h2 { font-size: 15px; margin: 0 0 10px; }
        .details ul { padding-left: 20px; margin: 0; line-height: 1.7; }
        .redirect { font-size: 12px; overflow-wrap: anywhere; color: #667786; }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        button { border: 0; border-radius: 9px; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
        .approve { color: white; background: #1769aa; flex: 1; }
        .deny { color: #344353; background: #e9eef3; }
        .csrf { display: none; }
    </style>
</head>
<body>
    <main>
        <h1>Authorize MCP connection</h1>
        <p><span class="client">{{ client_name }}</span> is asking to connect to your d'Avallka image library.</p>
        <section class="details">
            <h2>This connection can:</h2>
            <ul>{% for scope in scopes %}<li>{{ scope }}</li>{% endfor %}</ul>
        </section>
        <p class="redirect">After you choose, d'Avallka returns to: {{ redirect_uri }}</p>
        <form method="post" class="actions">
            <input class="csrf" type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="deny" type="submit" name="decision" value="deny">Cancel</button>
            <button class="approve" type="submit" name="decision" value="approve">Authorize</button>
        </form>
    </main>
</body>
</html>
